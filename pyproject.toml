[project]
name = "legoin-api"
version = "0.1.0"
description = "Legoin backend: runs the brick models on a photo and suggests builds from the pieces found"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pillow>=13.0.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# The real pipeline, pinned to the versions in legoin-ml v0.2.0's release notes. Tests and CI
# don't install it: they run the stub (`LEGOIN_PIPELINE=stub`).
models = [
    "ultralytics==8.4.190",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "scikit-learn==1.9.1",
    "scikit-image==0.26.0",
    # Ultralytics asks for opencv-python, which needs libGL; the headless build doesn't.
    "opencv-python-headless",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6"
# Swapped for opencv-python-headless (see `models`): same cv2 module, no GUI libraries.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# CPU-only torch wheels, a fraction of the CUDA builds' size. macOS wheels on PyPI are CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Part names use × and °, as the catalogue writes them.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Copied verbatim from legoin-web, so its sentences keep their length.
"src/legoin_api/ideas/templates.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
